[package]
name = "thread-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "UI-agnostic core for Thread: settings and stores."

# NOTE: this crate must never depend on tauri. Keeping it UI-agnostic is what
# lets the frontend be replaced later without touching the hard logic.
[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1.1.6"
toml_edit = "0.25.15"
trash = "5.2.9"
tracing.workspace = true
# Already in the tree by way of the window toolkit; the terminal calls the
# pseudoconsole API through it rather than through a PTY crate of its own.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1.53.2", features = ["rt", "sync", "net", "time", "io-util", "macros"] }
getrandom = "0.4.3"

[dev-dependencies]
rand = "0.10"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
